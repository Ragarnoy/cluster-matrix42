---
name: Minimal CI
on:
  push:
    branches:
      - master
  pull_request: {}
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDL2 dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
          libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Host-side library crates: check each feature independently.
      # --exclude-features tls: embedded-tls 0.18 has an upstream bug
      # (SequenceOf/SetOf used without enabling der's heapless feature)
      - name: Check host crates (each feature)
        run: |
          cargo hack check --each-feature --no-dev-deps \
            -p graphics-common -p cluster-core -p cluster-net \
            -p plugin-api \
            --exclude-features tls
          cargo hack check -p simulator
      # Embedded crates: check against the thumbv8m target.
      - name: Check embedded crates
        run: |
          cargo hack check --target thumbv8m.main-none-eabihf \
            -p hub75-driver --features gbr_128x128
          cargo hack check --target thumbv8m.main-none-eabihf \
            -p plugin-api -p plugin-host
          cargo hack check --target thumbv8m.main-none-eabihf \
            -p firmware --features "128"
      - name: Clippy - host crates
        run: |
          cargo hack clippy --each-feature --no-dev-deps \
            -p graphics-common -p cluster-core -p cluster-net \
            -p plugin-api \
            --exclude-features tls \
            -- -D warnings
          cargo clippy -p simulator -- -D warnings
      - name: Clippy - embedded crates
        run: |
          cargo clippy --target thumbv8m.main-none-eabihf \
            -p hub75-driver --features "gbr_128x128" -- -D warnings
          cargo clippy --target thumbv8m.main-none-eabihf \
            -p plugin-api -- -D warnings
          cargo clippy --target thumbv8m.main-none-eabihf \
            -p plugin-host -- -D warnings
          cargo clippy --target thumbv8m.main-none-eabihf \
            -p firmware --features "128" -- -D warnings
      - name: Build - host crates
        run: |
          cargo build -p graphics-common --release
          cargo build -p cluster-core --release
          cargo build -p cluster-net --release
          cargo build -p plugin-api --features std --release
          cargo build -p simulator --release
      - name: Build - embedded crates
        run: |
          cargo build --target thumbv8m.main-none-eabihf --release \
            -p hub75-driver --features "gbr_128x128"
          cargo build --target thumbv8m.main-none-eabihf --release \
            -p plugin-api
          cargo build --target thumbv8m.main-none-eabihf --release \
            -p plugin-host
          cargo build --target thumbv8m.main-none-eabihf --release \
            -p firmware --features "128"
      - name: Run tests
        run: |
          cargo test -p simulator
          cargo test -p graphics-common --features std
          cargo test -p cluster-core --features std
          cargo test -p cluster-net
      - name: Check binary size
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cargo install cargo-binutils
          rustup component add llvm-tools

          # Detect which crate hosts the basic_panel binary (workspace was
          # reorganized: basic-panel -> firmware). This keeps the size check
          # working across the rename.
          detect_pkg() {
            if cargo metadata --format-version 1 --no-deps \
                 2>/dev/null | grep -q '"name":"firmware"'; then
              echo "firmware"
            elif cargo metadata --format-version 1 --no-deps \
                 2>/dev/null | grep -q '"name":"basic-panel"'; then
              echo "basic-panel"
            else
              echo ""
            fi
          }

          build_and_size() {
            local pkg=$1
            local out=$2
            if [ -z "$pkg" ]; then
              echo "0" > "$out"
              return
            fi
            cargo build -p "$pkg" --target thumbv8m.main-none-eabihf \
              --release --bin basic_panel --features "128" || {
                echo "0" > "$out"; return;
              }
            cargo size --release --bin basic_panel -p "$pkg" \
              --target thumbv8m.main-none-eabihf \
              --features "128" -- -A > "$out" || echo "0" > "$out"
          }

          # Build current version
          PR_PKG=$(detect_pkg)
          build_and_size "$PR_PKG" pr-size.txt

          # Build base version
          git checkout ${{ github.event.pull_request.base.sha }}
          BASE_PKG=$(detect_pkg)
          build_and_size "$BASE_PKG" base-size.txt

          # Compare
          BASE_SIZE=$(grep "Total" base-size.txt | awk '{print $2}' || echo "0")
          PR_SIZE=$(grep "Total" pr-size.txt | awk '{print $2}' || echo "0")

          if [ -z "$BASE_SIZE" ] || [ "$BASE_SIZE" = "0" ]; then
            echo "Base size unavailable (likely workspace rename) - skipping comparison"
            exit 0
          fi
          if [ -z "$PR_SIZE" ] || [ "$PR_SIZE" = "0" ]; then
            echo "PR size unavailable - skipping comparison"
            exit 0
          fi

          DIFF=$((PR_SIZE - BASE_SIZE))
          PERCENT=$((DIFF * 100 / BASE_SIZE))
          echo "Size change: $DIFF bytes ($PERCENT%)"
          if [ $PERCENT -gt 15 ]; then
            echo "ERROR: Binary size increased by more than 15%!"
            exit 1
          fi
