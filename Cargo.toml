[workspace]
resolver = "3"
members = [
    "crates/graphics-common",
    "crates/cluster-core",
    "crates/cluster-macros",
    "crates/cluster-net",
    "crates/hub75-driver",
    "firmware",
    "eth-test",
    "simulator",
    "plugins/plugin-api",
    "plugins/plugin-host",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2

[profile.dev]
lto = true

[workspace.dependencies]
# Local dependencies
graphics-common = { path = "crates/graphics-common" }
cluster-core = { path = "crates/cluster-core" }
cluster-macros = { path = "crates/cluster-macros" }
cluster-net = { path = "crates/cluster-net" }
plugin-api = { path = "plugins/plugin-api" }
hub75-driver = { path = "crates/hub75-driver" }

# Embedded dependencies
embedded-graphics-core = "0.4"
embedded-graphics = "0.8.1"

# Logging dependencies
defmt = { version = "1.0" }
defmt-rtt = { version = "1.0" }
panic-probe = { version = "1.0" }

# Embassy dependencies
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy" }
embassy-time = { git = "https://github.com/embassy-rs/embassy" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy" }

# Misc dependencies
static_cell = "2.1"
heapless = "0.9.2"
libm = "0.2.15"
