[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
hub75-driver = { workspace = true }
graphics-common = { workspace = true }
cluster-core = { workspace = true }
plugin-host = { path = "../plugins/plugin-host", features = ["defmt"] }
plugin-api = { path = "../plugins/plugin-api" }
embedded-graphics-core = { workspace = true }

# Logging dependencies
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }

# Embassy dependencies
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { workspace = true }

# Networking
cluster-net = { workspace = true, features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "tcp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-net-wiznet = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-nal-async = "0.9"

# No std deps
static_cell = { workspace = true }
smart-leds = "0.4"

[lib]
test = false
bench = false

[[bin]]
name = "basic_panel"
test = false
bench = false

[[bin]]
name = "cluster_matrix"
test = false
bench = false

[[bin]]
name = "plugin_test"
test = false
bench = false

[features]
waveshare = ["hub75-driver/waveshare_64x32"]
128 = ["hub75-driver/gbr_128x128"]
64 = ["hub75-driver/gbr_64x64"]
# Local mirror so cfg(feature = "devkit_remap") works inside this crate.
devkit_remap = ["hub75-driver/devkit_remap"]
devkit = ["128", "devkit_remap"]
